name: Health Atlas WHO country prevalence
on:
  push:
    branches: [health-atlas-global-20261005]
    paths: [.github/workflows/health-atlas-who-series.yml]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Retrieve official WHO country series
        run: |
          python -m pip install --quiet requests
          python - <<'PY'
          import requests,pathlib,json,hashlib,concurrent.futures,time
          out=pathlib.Path('who-series');out.mkdir()
          codes=['NCD_HYP_PREVALENCE_A','NCD_HYP_PREVALENCE_C','NCD_BMI_30A','NCD_BMI_30C','NCD_DIABETES_PREVALENCE_AGESTD','NCD_DIABETES_PREVALENCE_CRUDE']
          def get(code):
            url='https://ghoapi.azureedge.net/api/'+code
            params={'$filter':"SpatialDimType eq 'COUNTRY' and Dim1 eq 'BTSX' and TimeDim ge 2000 and TimeDim le 2025"}
            records=[];entries=[]
            for page in range(30):
              for attempt in range(3):
                try:
                  r=requests.get(url,params=params,timeout=90);r.raise_for_status();data=r.json();break
                except Exception as e:
                  if attempt==2:return {'code':code,'error':str(e),'pages':entries}
                  time.sleep(2)
              entries.append({'url':r.url,'bytes':len(r.content),'sha256':hashlib.sha256(r.content).hexdigest()})
              records.extend(data.get('value',[]))
              url=data.get('@odata.nextLink');params=None
              if not url:break
            else:raise RuntimeError('Pagination limit reached')
            (out/(code+'.json')).write_text(json.dumps(records))
            years=sorted(set(x['TimeDim'] for x in records))
            result={'code':code,'rows':len(records),'years':years,'countries':len(set(x['SpatialDim'] for x in records)),'pages':entries}
            print(json.dumps(result),flush=True)
            print('EXAMPLE',code,json.dumps(records[:1]),flush=True)
            return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as e:manifest=list(e.map(get,codes))
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: health-atlas-who-series
          path: who-series/
          retention-days: 14
