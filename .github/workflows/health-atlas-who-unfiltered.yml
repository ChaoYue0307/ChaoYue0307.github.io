name: Health Atlas WHO dimensional audit
on:
  push:
    branches: [health-atlas-global-20261005]
    paths: [.github/workflows/health-atlas-who-unfiltered.yml]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Retrieve public WHO series without guessing dimension filters
        run: |
          python -m pip install --quiet requests
          python - <<'PY'
          import requests,pathlib,json,hashlib,concurrent.futures,time,collections
          out=pathlib.Path('who-unfiltered');out.mkdir()
          codes=['NCD_HYP_PREVALENCE_A','NCD_HYP_PREVALENCE_C','NCD_BMI_30A','NCD_BMI_30C','NCD_DIABETES_PREVALENCE_AGESTD','NCD_DIABETES_PREVALENCE_CRUDE']
          def get(code):
            url='https://ghoapi.azureedge.net/api/'+code;records=[];entries=[]
            for page in range(50):
              for attempt in range(3):
                try:
                  r=requests.get(url,timeout=100);r.raise_for_status();data=r.json();break
                except Exception as e:
                  if attempt==2:return {'code':code,'error':str(e),'pages':entries}
                  time.sleep(2)
              entries.append({'url':r.url,'bytes':len(r.content),'sha256':hashlib.sha256(r.content).hexdigest()})
              records.extend(data.get('value',[]));url=data.get('@odata.nextLink')
              if not url:break
            else:raise RuntimeError('Unfinished pagination')
            (out/(code+'.json')).write_text(json.dumps(records))
            dims={k:dict(collections.Counter(str(x.get(k)) for x in records)) for k in ['SpatialDimType','Dim1Type','Dim1','Dim2Type','Dim2','Dim3Type','Dim3']}
            result={'code':code,'rows':len(records),'years':sorted(set(x.get('TimeDim',0) for x in records)),'dims':dims,'sample':records[:2],'pages':entries}
            print(json.dumps(result),flush=True);return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as e:manifest=list(e.map(get,codes))
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: health-atlas-who-unfiltered
          path: who-unfiltered/
          retention-days: 14
