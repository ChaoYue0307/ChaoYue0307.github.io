name: Sci-Fi Atlas quality checks

on:
  push:
    paths:
      - 'scifi-atlas/**'
      - '.github/workflows/scifi-atlas.yml'
  pull_request:
    paths:
      - 'scifi-atlas/**'
      - '.github/workflows/scifi-atlas.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scifi-atlas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scifi-atlas
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate data, search, storage, and static rendering
        run: npm test
      - name: Check generated pages are current
        run: npm run check:build
      - name: Install pinned browser test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Provide Chinese glyphs for visual review
        run: sudo apt-get install -y fonts-noto-cjk
      - name: Start static server
        working-directory: .
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/scifi-atlas-server.log 2>&1 &
      - name: Check browser behavior, accessibility, and responsive layouts
        run: npm run test:browser
      - name: Preserve verification report and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scifi-atlas-qa
          path: |
            scifi-atlas/qa-output/
            scifi-atlas/package-lock.json
          retention-days: 7
          if-no-files-found: warn
